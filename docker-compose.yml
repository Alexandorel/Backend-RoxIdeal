services:
  postgres:
    image: postgres:16
    container_name: roxideal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: roxideal_user
      POSTGRES_PASSWORD: roxideal
      POSTGRES_DB: roxideal
    ports:
      - "5432:5432"
    volumes:
      - roxideal_pgdata:/var/lib/postgresql/data

volumes:
  roxideal_pgdata:
