spring.application.name=backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/roxideal}
spring.datasource.username=${DB_USER:roxideal_user}
spring.datasource.password=${DB_PASSWORD:roxideal}

# Hibernate hecks it matches the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true

# Admin seeder var
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
